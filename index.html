<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Check-in</title>
<meta name="theme-color" content="#F2F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

/* Layout: single phone column — date header, week strip, today's plan by muscle region with animated form figures, then a live session view with a sticky timer bar. Day colors borrow from bumper plates. */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --fg:#17191C; --muted:#5F656C; --line:#DADDDA;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --done:#1E8A4C; --done-soft:#DDF1E4;
  --p-red:#C8352E; --p-blue:#1F4FD1; --p-yellow:#D9A300; --p-green:#2E8B4E; --p-black:#2A2D31; --p-grey:#8A9097;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1B1E22; --fg:#ECEEF0; --muted:#9AA1A8; --line:#2C3036;
  --accent:#5B84F5; --accent-ink:#0D1220; --done:#4CC27D; --done-soft:#17321F;
  --p-red:#E2554D; --p-blue:#5B84F5; --p-yellow:#E8B92A; --p-green:#4CB36E; --p-black:#C9CDD2; --p-grey:#7C838B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1B1E22; --fg:#ECEEF0; --muted:#9AA1A8; --line:#2C3036;
  --accent:#5B84F5; --accent-ink:#0D1220; --done:#4CC27D; --done-soft:#17321F;
  --p-red:#E2554D; --p-blue:#5B84F5; --p-yellow:#E8B92A; --p-green:#4CB36E; --p-black:#C9CDD2; --p-grey:#7C838B;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,56px);line-height:.95;margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
h1 .plate{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--day);margin-left:.15em;vertical-align:.1em;box-shadow:inset 0 0 0 .14em color-mix(in srgb,var(--day) 60%,#000)}
.sub{color:var(--muted);margin-top:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;min-width:0}
.day .dn{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .dd{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.day .bar{width:60%;height:4px;border-radius:2px;background:var(--c)}
.day.sel{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.day.today .dn{color:var(--fg);font-weight:700}
.day .chk{position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--done);color:var(--bg);font-size:12px;display:grid;place-items:center;font-weight:700}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:20px;color:var(--fg);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px;border-top:5px solid var(--day)}
.panel-h h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.02em}
.cover{padding:0 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rg{font-size:12px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.cyc{font-size:12px;color:var(--muted)}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:48%}
.ex{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.ex:last-child{border-bottom:0}
.fig{width:84px;height:66px;border-radius:10px;background:var(--bg);display:block;grid-row:span 1}
.fig .bd{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fig .bd2{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;opacity:.45}
.fig .hd{fill:var(--fg)}
.fig .gh{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;opacity:.28}
.fig .pr{fill:var(--line);stroke:var(--line);stroke-width:3;stroke-linecap:round}
.fig .gr{stroke:var(--line);stroke-width:1.5}
.fig .eq{fill:var(--day)}
.fig .eqs{fill:none;stroke:var(--day);stroke-width:1.4}
.fig .eqw{fill:none;stroke:var(--day);stroke-width:2.6}
.fig .eqh{fill:var(--surface)}
.exm{display:flex;flex-direction:column;gap:2px;min-width:0}
.region{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.region::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--day)}
.ex .name{font-weight:600}
.ex .scheme{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.ex .tip{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:14px;align-items:center;margin-top:4px;font-size:13px}
.acts a{text-decoration:none;font-weight:600}
.lnk{border:0;background:none;padding:0;font-size:13px;font-weight:600;color:var(--muted)}
.lnk:hover,.acts a:hover{text-decoration:underline}
.sets{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.set{min-width:48px;height:44px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:4px}
.set small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.set.on{background:var(--done);border-color:var(--done);color:var(--bg)}
.set.on small{color:inherit;opacity:.85}
.kg{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:13px;color:var(--muted)}
.kg input{width:64px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:600 16px var(--mono);text-align:center}
.ex.complete .name::after{content:" ✓";color:var(--done)}
.rest-day{padding:18px 16px;color:var(--muted)}
.rest-day ul{margin:8px 0 0;padding-left:18px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg);font-size:17px;padding:12px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--done-soft);color:var(--fg)}
.banner .big{font-family:var(--display);font-weight:800;font-size:28px;color:var(--done);line-height:1}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.timer{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.timer .clock{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;min-width:68px}
.timer .clock.go{color:var(--done)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600}
.chip.on{border-color:var(--accent);color:var(--accent)}
.dock .btn{width:auto;padding:12px 18px;font-size:18px}
.elapsed{font-family:var(--mono);font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:380px){.ex{grid-template-columns:72px minmax(0,1fr) auto}.fig{width:72px;height:57px}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>

for(const k in pat){ pat[k].b={...pat[k].a,...pat[k].b}; }

const pt=a=>a[0].toFixed(1)+" "+a[1].toFixed(1);
const seg=(a,b)=>a&&b?`M${pt(a)}L${pt(b)}`:"";
function lerp(A,B,t){const o={};for(const k in A){o[k]=[A[k][0]+(B[k][0]-A[k][0])*t,A[k][1]+(B[k][1]-A[k][1])*t];}return o;}
function body(z,v){
  if(v==="side") return {d:seg(z.s,z.p)+seg(z.s,z.e)+seg(z.e,z.w)+seg(z.p,z.k)+seg(z.k,z.f)+seg(z.f,z.t||[z.f[0]+5,z.f[1]]),
    d2:seg(z.s,z.e2)+seg(z.e2,z.w2)+seg(z.p,z.k2)+seg(z.k2,z.f2)+(z.f2?seg(z.f2,[z.f2[0]+5,z.f2[1]]):"")};
  const nk=[(z.sL[0]+z.sR[0])/2,z.sL[1]];
  return {d:seg(z.sL,z.sR)+seg(z.sL,z.pL)+seg(z.sR,z.pR)+seg(z.pL,z.pR)+seg(z.h,nk)+seg(z.sL,z.eL)+seg(z.eL,z.wL)+seg(z.sR,z.eR)+seg(z.eR,z.wR)+seg(z.pL,z.kL)+seg(z.kL,z.fL)+seg(z.pR,z.kR)+seg(z.kR,z.fR),d2:""};
}
function equip(P,z,eq){
  if(eq==="bw") return "";
  let holds=P.hold||(P.v==="front"?["wL","wR"]:["w"]);
  if(!P.hold&&z.w2) holds=[...holds,"w2"];
  let o="";
  if(eq==="cb"&&P.an){
    const an=Array.isArray(P.an[0])?P.an:[P.an];
    holds.forEach((h,i)=>{const a=an[Math.min(i,an.length-1)];o+=`<path class="eqs" d="${seg(z[h],a)}"/>`;});
  }
  if(eq==="bb"&&P.v==="front"){
    const y=(z.wL[1]+z.wR[1])/2,x1=Math.min(z.wL[0],z.wR[0])-12,x2=Math.max(z.wL[0],z.wR[0])+12;
    return o+`<path class="eqw" d="M${x1} ${y}H${x2}"/><rect class="eq" x="${x1-3}" y="${y-6}" width="4" height="12" rx="1"/><rect class="eq" x="${x2-1}" y="${y-6}" width="4" height="12" rx="1"/>`;
  }
  holds.forEach(h=>{ if(!z[h]) return; const [x,y]=z[h];
    if(eq==="bb") o+=`<circle class="eq" cx="${x}" cy="${y}" r="6.5"/><circle class="eqh" cx="${x}" cy="${y}" r="1.6"/>`;
    else if(eq==="db") o+=`<rect class="eq" x="${x-5}" y="${y-2.2}" width="10" height="4.4" rx="2"/>`;
    else if(eq==="wheel") o+=`<circle class="eqw" cx="${x}" cy="${y+1}" r="5"/>`;
    else o+=`<circle class="eq" cx="${x}" cy="${y}" r="2.8"/>`;
  });
  return o;
}
function figure(p,eq,label){
  const P=pat[p]; const g=body(P.a,P.v);
  return `<svg class="fig" viewBox="0 -8 120 98" role="img" aria-label="${label}" data-p="${p}" data-eq="${eq}">
    <path class="gr" d="M2 84H118"/><g class="pr">${P.pr}</g>
    <path class="gh" d="${g.d}"/><circle class="gh" cx="${P.a.h[0]}" cy="${P.a.h[1]}" r="5"/>
    <g class="dyn">${frame(p,eq,1)}</g></svg>`;
}
function frame(p,eq,t){
  const P=pat[p], z=lerp(P.a,P.b,t), g=body(z,P.v);
  return `<path class="bd2" d="${g.d2}"/><path class="bd" d="${g.d}"/><circle class="hd" cx="${z.h[0].toFixed(1)}" cy="${z.h[1].toFixed(1)}" r="5"/>${equip(P,z,eq)}`;
}
let figs=[], last=0;
const still=matchMedia("(prefers-reduced-motion: reduce)");
function animate(ts){
  if(!still.matches && ts-last>40){
    last=ts; const t=(1-Math.cos(ts/2600*2*Math.PI))/2;
    figs.forEach(f=>{f.g.innerHTML=frame(f.p,f.eq,t);});
  }
  requestAnimationFrame(animate);
}

const WEEK=["chest","back","legs","shoulders","arms","legs2","rest"];
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const KEY="gymcheck-v1";
const EPOCH=new Date(2026,10,9); // cycle week 1 starts Mon 9 Nov 2026

let store={logs:{}};
try{ const s=localStorage.getItem(KEY); if(s) store=JSON.parse(s)||store; }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date(); today.setHours(0,0,0,0);
const todayKey=iso(today);
const dow=d=>(d.getDay()+6)%7;
let selKey=todayKey, mode="plan";

function keyToDate(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function weekNo(k){const d=keyToDate(k);const mon=new Date(d);mon.setDate(d.getDate()-dow(d));return Math.round((mon-EPOCH)/864e5/7);}
const mod=(a,n)=>((a%n)+n)%n;
function planFor(k){const l=store.logs[k];return (l&&l.split)||WEEK[dow(keyToDate(k))];}
function log(k){
  const L=store.logs[k]||(store.logs[k]={split:planFor(k),sets:{},kg:{},pick:{}});
  L.pick=L.pick||{}; L.kg=L.kg||{}; L.sets=L.sets||{};
  if(L.v!==2){ // older saves stored weights by position
    const sl=PLANS[L.split].slots, nk={};
    for(const i in L.kg){ const sv=sl[i]; if(sv&&L.kg[i]) nk[sv.opts[0].n]=L.kg[i]; }
    L.kg=nk; L.v=2;
  }
  return L;
}
function variant(k,i){
  const sl=PLANS[planFor(k)].slots[i], L=store.logs[k];
  let idx = L&&L.pick&&L.pick[i]!=null ? L.pick[i] : (sl.main?Math.floor(weekNo(k)/4):weekNo(k)+i*0);
  idx=mod(idx,sl.opts.length);
  const o=sl.opts[idx];
  return {...o, idx, reps:o.reps||sl.reps, sets:sl.s, region:sl.r};
}
function weekDays(){const mon=new Date(today);mon.setDate(today.getDate()-dow(today));return [...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function streak(){
  let n=0;const d=new Date(today);const L=store.logs[todayKey];if(!(L&&L.finished)) d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){const k=iso(d),l=store.logs[k];if(l&&l.finished)n++;else if(planFor(k)!=="rest")break;d.setDate(d.getDate()-1);}
  return n;
}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function lastKg(name){
  const ks=Object.keys(store.logs).filter(k=>k<selKey&&store.logs[k].kg&&store.logs[k].kg[name]).sort();
  return ks.length?store.logs[ks.at(-1)].kg[name]:"";
}
function countSets(k){
  const L=store.logs[k],sl=PLANS[L.split].slots;let total=0,done=0;
  sl.forEach((s,i)=>{total+=s.s;done+=(L.sets[i]||[]).filter(Boolean).length;});
  return {total,done};
}
const demo=n=>"https://www.youtube.com/results?search_query="+encodeURIComponent(n+" exercise proper form");

function exRow(i,live){
  const v=variant(selKey,i), L=store.logs[selKey], lk=lastKg(v.n), sl=PLANS[planFor(selKey)].slots[i];
  const s=(L&&L.sets[i])||[], all=live&&s.filter(Boolean).length===v.sets;
  let h=`<div class="ex ${all?"complete":""}">${figure(v.p,v.eq,v.n+" movement")}
    <div class="exm"><span class="region">${v.region}</span><span class="name">${v.n}</span>
    <span class="tip">${v.tip}${lk?` · last ${lk} kg`:""}</span>
    <div class="acts"><a href="${demo(v.n)}" target="_blank" rel="noopener">Watch demo ↗</a>${sl.opts.length>1?`<button class="lnk" data-swap="${i}">Swap (${v.idx+1}/${sl.opts.length})</button>`:""}</div></div>
    <span class="scheme">${v.sets} × ${v.reps}</span>`;
  if(live){
    h+=`<div class="sets">${[...Array(v.sets)].map((_,j)=>`<button class="set ${s[j]?"on":""}" data-i="${i}" data-j="${j}" aria-pressed="${!!s[j]}">${j+1}<small>${v.reps}</small></button>`).join("")}
      <label class="kg"><input id="kg-${i}" inputmode="decimal" data-kg="${i}" value="${(L.kg[v.n])||""}" placeholder="${lk||"—"}" aria-label="Weight for ${v.n} in kg">kg</label></div>`;
  }
  return h+`</div>`;
}

function render(){
  const app=document.getElementById("app");
  const d=keyToDate(selKey),split=planFor(selKey),P=PLANS[split],L=store.logs[selKey];
  const isToday=selKey===todayKey;
  app.style.setProperty("--day",`var(${P.color})`);
  document.getElementById("dock").style.setProperty("--day",`var(${P.color})`);
  const days=weekDays();
  const weekDone=days.filter(x=>store.logs[iso(x)]?.finished).length;
  const total=Object.values(store.logs).filter(l=>l.finished).length;
  const dateStr=d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short",year:"numeric"});
  const wk=weekNo(selKey);

  let h=`<header><div class="eyebrow">${isToday?"Today · ":""}${dateStr}</div>
    <h1>${P.name}<span class="plate" aria-hidden="true"></span></h1></header>
  <nav class="week" aria-label="This week">${days.map(x=>{const k=iso(x),p=PLANS[planFor(k)];
    return `<button class="day ${k===selKey?"sel":""} ${k===todayKey?"today":""}" data-k="${k}" style="--c:var(${p.color})" aria-label="${DN[dow(x)]} ${x.getDate()}, ${p.name}">
      <span class="dn">${DN[dow(x)]}</span><span class="dd">${x.getDate()}</span><span class="bar"></span>
      ${store.logs[k]?.finished?'<span class="chk" aria-hidden="true">✓</span>':""}</button>`;}).join("")}</nav>
  <div class="stats"><span><b>${streak()}</b>day streak</span><span><b>${weekDone}</b>this week</span><span><b>${total}</b>check-ins total</span></div>`;

  const live=mode==="live"&&isToday;
  if(live){
    const c=countSets(todayKey);
    h+=`<div class="progress" aria-label="${c.done} of ${c.total} sets"><i style="width:${c.total?c.done/c.total*100:0}%"></i></div>
      <div class="sub" style="margin-top:-12px">${c.done} of ${c.total} sets · tap a set when it's done</div>`;
  } else {
    document.getElementById("dock").hidden=true;
    if(L&&L.finished){
      const c=countSets(selKey);
      h+=`<div class="banner"><span class="big">✓</span><div><b>Checked in</b><br><span class="sub">${c.done}/${c.total} sets · ${fmt((L.finished-L.started)/1000)} min · done at ${new Date(L.finished).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}</span></div></div>`;
    }
  }

  h+=`<section class="panel"><div class="panel-h"><h2>${split==="rest"?"Recovery":live?"Session":"The plan"}</h2>
    ${live?`<span class="elapsed" id="elapsed"></span>`:`<select id="swapday" aria-label="Change workout for this day">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}" ${k===split?"selected":""}>${p.name}</option>`).join("")}</select>`}</div>`;
  if(split==="rest"){
    h+=`<div class="rest-day">No lifting today. Muscles grow while you recover.<ul><li>20–30 min walk</li><li>10 min stretching or mobility</li><li>Sleep well and hit your protein</li></ul></div>`;
  } else {
    const regions=P.slots.map(s=>s.r.split(" · ").filter(x=>!/main/.test(x)).join(" · "));
    h+=`<div class="cover"><div class="chips">${regions.map(r=>`<span class="rg">${r}</span>`).join("")}</div>
      <div class="cyc">Cycle week ${mod(wk,12)+1} · accessories rotate every week, the main lift every 4 weeks so you can keep adding weight.</div></div>`;
    h+=P.slots.map((_,i)=>exRow(i,live)).join("");
  }
  h+=`</section>`;

  if(live) h+=`<button class="btn ghost" id="cancel">Back to plan</button>`;
  else if(isToday&&split!=="rest") h+=L&&L.finished?`<button class="btn ghost" id="again">Reopen session</button>`:`<button class="btn" id="start">${L&&L.started?"Resume workout":"Start workout"}</button>`;
  else if(isToday) h+=L&&L.finished?"":`<button class="btn ghost" id="restci">Check in rest day</button>`;
  else h+=`<button class="btn ghost" id="back">Back to today</button>`;
  h+=`<p class="note">Saved on this phone. Figures show the movement; tap “Watch demo” for a full video.</p>`;
  app.innerHTML=h;
  if(live) renderDock();
  figs=[...document.querySelectorAll(".fig")].map(el=>({g:el.querySelector(".dyn"),p:el.dataset.p,eq:el.dataset.eq}));
  bind();
}

/* ---------- rest timer ---------- */
let restLen=90,restEnd=0,tick=null,actx=null,beeped=true;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.35);}catch(e){}try{navigator.vibrate&&navigator.vibrate(300);}catch(e){}}
function renderDock(){
  const dock=document.getElementById("dock");dock.hidden=false;
  dock.innerHTML=`<div class="dock-in"><div class="timer"><span class="clock" id="clock">Rest</span>
    ${[60,90,120].map(s=>`<button class="chip ${s===restLen?"on":""}" data-rest="${s}">${s}s</button>`).join("")}</div>
    <button class="btn" id="finish">Finish</button></div>`;
  dock.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>{restLen=+b.dataset.rest;startRest();renderDock();});
  dock.querySelector("#finish").onclick=finish;
  if(!tick) tick=setInterval(update,250); update();
}
function startRest(){restEnd=Date.now()+restLen*1000;beeped=false;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}update();}
function update(){
  const c=document.getElementById("clock"),el=document.getElementById("elapsed"),L=store.logs[todayKey];
  if(el&&L&&L.started) el.textContent=fmt((Date.now()-L.started)/1000)+" in";
  if(!c) return;
  const left=(restEnd-Date.now())/1000;
  if(restEnd&&left>0){c.textContent=fmt(left);c.classList.remove("go");}
  else if(restEnd){c.textContent="Go!";c.classList.add("go");if(!beeped){beeped=true;beep();}}
  else c.textContent="Rest";
}
let wake=null;
async function keepAwake(){try{wake=await navigator.wakeLock?.request("screen");}catch(e){}}
function finish(){const L=log(todayKey);L.finished=Date.now();save();mode="plan";restEnd=0;try{wake&&wake.release();}catch(e){}render();}

function bind(){
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{selKey=b.dataset.k;if(selKey!==todayKey)mode="plan";render();});
  const sw=document.getElementById("swapday");if(sw) sw.onchange=()=>{const L=log(selKey);L.split=sw.value;L.sets={};L.pick={};save();render();};
  document.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.swap,L=log(selKey),v=variant(selKey,i),n=PLANS[L.split].slots[i].opts.length;
    L.pick[i]=(v.idx+1)%n; L.sets[i]=[]; save(); render();
  });
  const st=document.getElementById("start");if(st) st.onclick=()=>{const L=log(todayKey);if(!L.started)L.started=Date.now();save();mode="live";keepAwake();render();window.scrollTo(0,0);};
  const ag=document.getElementById("again");if(ag) ag.onclick=()=>{const L=log(todayKey);delete L.finished;save();mode="live";render();};
  const rc=document.getElementById("restci");if(rc) rc.onclick=()=>{const L=log(todayKey);L.started=L.finished=Date.now();save();render();};
  const bk=document.getElementById("back");if(bk) bk.onclick=()=>{selKey=todayKey;render();};
  const cn=document.getElementById("cancel");if(cn) cn.onclick=()=>{mode="plan";render();};
  document.querySelectorAll(".set").forEach(b=>b.onclick=()=>{
    const L=log(todayKey),i=b.dataset.i,j=+b.dataset.j;L.sets[i]=L.sets[i]||[];
    L.sets[i][j]=!L.sets[i][j];save();if(L.sets[i][j])startRest();render();
  });
  document.querySelectorAll("[data-kg]").forEach(inp=>inp.onchange=()=>{const L=log(todayKey),v=variant(todayKey,+inp.dataset.kg);L.kg[v.n]=inp.value.trim();save();});
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&mode==="live")keepAwake();});
render();
requestAnimationFrame(animate);
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
</script>
</body>
</html>
